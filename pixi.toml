[workspace]
name = "mouse-joystick-firm"
version = "0.1.0"
description = "Firmware for mouse-joystick-pcb: RP2040 plus TMC5130A, single joystick axis, pyControl peripheral."
authors = ["Peter Polidoro <peter@polidoro.io>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[dependencies]
# PlatformIO CLI (conda-forge, noarch). Provides the `pio` command.
platformio = ">=6.1.19,<7"
# Explicit Python for the repo helper scripts.
python = ">=3.12,<=3.14"
clang-format = ">=18,<21"
git = "*"

# --------------------------------------------------------------------------------------
# PlatformIO helpers
#
# The example to build is selected by setting PLATFORMIO_SRC_DIR rather than by
# editing platformio.ini. A Python wrapper keeps that portable across shells.
# --------------------------------------------------------------------------------------

[tasks]
# List connected devices/ports (/dev/ttyACM0, /dev/cu.usbmodem*, COM3, ...).
ports = "pio device list"

[tasks.pio-version]
cmd = "pio --version"

[tasks.build]
description = "Compile an example without uploading."
args = [
  { arg = "example", default = "examples/RP2040SelfTest" },
  { arg = "env", default = "mouse_joystick" },
]
cmd = "python tools/pio_task.py build --example {{ example }} --env {{ env }}"

[tasks.clean]
args = [
  { arg = "example", default = "examples/RP2040SelfTest" },
  { arg = "env", default = "mouse_joystick" },
]
cmd = "python tools/pio_task.py clean --example {{ example }} --env {{ env }}"

[tasks.upload]
description = "Build and upload. Needs the board in BOOTSEL, or already running firmware that honours the 1200 baud touch."
args = [
  { arg = "example", default = "examples/RP2040SelfTest" },
  { arg = "env", default = "mouse_joystick" },
  { arg = "port", default = "/dev/ttyACM0" },
]
cmd = "python tools/pio_task.py upload --example {{ example }} --env {{ env }} --port {{ port }}"

[tasks.flash]
description = "Clean, then build and upload."
args = [
  { arg = "example", default = "examples/RP2040SelfTest" },
  { arg = "env", default = "mouse_joystick" },
  { arg = "port", default = "/dev/ttyACM0" },
]
cmd = "python tools/pio_task.py flash --example {{ example }} --env {{ env }} --port {{ port }}"

[tasks.rebuild]
description = "Clean, then compile."
args = [
  { arg = "example", default = "examples/RP2040SelfTest" },
  { arg = "env", default = "mouse_joystick" },
]
cmd = "python tools/pio_task.py rebuild --example {{ example }} --env {{ env }}"

[tasks.deepclean]
description = "Delete the isolated build directory for one example."
args = [{ arg = "example", default = "examples/RP2040SelfTest" }]
cmd = "python tools/pio_task.py deepclean --example {{ example }}"

[tasks.monitor]
description = "Open the USB CDC serial monitor. This board's only feedback channel."
args = [
  { arg = "port", default = "/dev/ttyACM0" },
  { arg = "baud", default = "115200" },
]
cmd = "python tools/pio_task.py monitor --port {{ port }} --baud {{ baud }}"

[tasks.test]
description = "Run host-native Unity tests. Covers only the Arduino-free arithmetic."
args = [{ arg = "env", default = "native" }]
cmd = "python tools/pio_task.py test --env {{ env }}"

# --------------------------------------------------------------------------------------
# clang-format
# --------------------------------------------------------------------------------------

[tasks.format]
description = "Format staged changes only, for C/C++/Arduino (.ino)."
cmd = "git clang-format --staged --style=file --binary clang-format --extensions c,cc,cpp,cxx,h,hh,hpp,hxx,ino"

[tasks.format-wip]
description = "Format working tree changes, including unstaged files."
cmd = "git clang-format --style=file --binary clang-format --extensions c,cc,cpp,cxx,h,hh,hpp,hxx,ino --force"

# --------------------------------------------------------------------------------------
# git archive
# --------------------------------------------------------------------------------------

[tasks.archive]
description = "Export the repository at the tip of the current branch."
cmd = "git archive --format=zip --output=../mouse-joystick-firm.zip HEAD"

# --------------------------------------------------------------------------------------
# pyControl host environment (Stage 4)
#
# This is the OTHER end of the UART protocol: the host GUI, and the Python used to
# develop and test the MicroPython device class that runs on the pyControl board.
#
# It is a separate environment with `no-default-feature`, so PlatformIO and Qt never
# resolve together. Someone who only wants to build firmware runs `pixi install` and
# never downloads Qt; someone who only wants the GUI never downloads a toolchain.
#
# Deps are what pyControl v2.1.1 actually requires. `pyControl_GUI.pyw` checks for
# numpy, serial and pyqtgraph; `source/gui/GUI_main.py` imports Qt through
# `pyqtgraph.Qt`, so the binding is pyqtgraph's choice and pyqt6 is supplied for it.
#
# Deliberately NOT merged with the rig's camera environment: `joystick-rig`
# pins numpy<2 for PySpin 4.3.0.190, and pyqtgraph 0.14 wants numpy 2.x. They are
# separate processes. Keep them separate environments.
# --------------------------------------------------------------------------------------

[feature.pycontrol.dependencies]
python = ">=3.11,<3.14"
numpy = ">=2,<3"
pyserial = ">=3.5"
pyqtgraph = ">=0.13"
pyqt6 = ">=6.7"
pytest = ">=8"

[feature.pycontrol.tasks.pycontrol-check]
description = "Verify the environment satisfies pyControl's own dependency gate."
cmd = "python tools/pycontrol_task.py check"

[feature.pycontrol.tasks.gui]
description = "Launch the pyControl GUI from a checkout. Set PYCONTROL_DIR, or pass --pycontrol-dir."
cmd = "python tools/pycontrol_task.py gui"

[feature.pycontrol.tasks.pycontrol-link]
description = "Point an unforked pyControl checkout at this repo's device class, hardware definition and tasks."
cmd = "python tools/pycontrol_task.py link"

[feature.pycontrol.tasks.pycontrol-test]
description = "Host-side pytest for the pyControl device class and protocol (Gate C)."
cmd = "pytest pycontrol/tests -q"

[feature.pycontrol.tasks.pycontrol-run]
description = "Run a task on the pyboard headlessly through pyControl's own board API (Gate E): hardware definition, device files and task uploaded, events streamed back."
args = [
  { arg = "port", default = "/dev/ttyACM1" },
  { arg = "hwd", default = "mouse_joystick_bringup" },
  { arg = "task", default = "mouse_joystick_check" },
  { arg = "seconds", default = "60" },
]
cmd = "python tools/pycontrol_run.py --port {{ port }} --hwd {{ hwd }} --task {{ task }} --seconds {{ seconds }}"

# Which LA5032 is watching which board. Runs `instrument-control`'s general
# tool -- the decode logic and the frame contract live there and in
# `board-interfaces`, not here -- but under THIS environment's interpreter,
# which is where pyserial comes from. Deliberately not a second copy of that
# script: two divergent implementations of a wire format is the failure mode
# worth avoiding.
[feature.pycontrol.tasks.identify-analyzers]
description = "Map each LA5032 to the board it probes, by identity beacon. No 36 V needed."
cmd = """python ../instrument-control/tools/identify_boards.py
  --board-glob '/dev/serial/by-id/usb-Orb_Weaver_mouse-joystick-pcb_*-if00'"""

[environments]
# `default` stays implicit: the firmware toolchain, unchanged.
pycontrol = { features = ["pycontrol"], no-default-feature = true }

# --------------------------------------------------------------------------------------
# Build tooling for PlatformIO native tests on POSIX.
# --------------------------------------------------------------------------------------

[target.linux-64.dependencies]
make = "*"
c-compiler = "*"
cxx-compiler = "*"

[target.osx-64.dependencies]
make = "*"
c-compiler = "*"
cxx-compiler = "*"

[target.osx-arm64.dependencies]
make = "*"
c-compiler = "*"
cxx-compiler = "*"
