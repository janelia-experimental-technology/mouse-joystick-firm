[platformio]
; Default program only. Select another with the Pixi tasks or
; `python tools/pio_task.py build --example examples/... --env ...` rather than
; editing this line -- builds are kept in per-example directories so switching
; does not invalidate a cache.
src_dir = examples/RP2040SelfTest

lib_dir = src
default_envs = mouse_joystick

[common_env_data]
build_flags =
    -Isrc
lib_deps_builtin =
    SPI
; symlink:// rather than a bare path. A bare local path makes PlatformIO COPY
; the directory into .pio/libdeps/ and it does not refresh the copy when the
; source changes -- not on a rebuild, and not on `-t clean` either. Edits to
; src/MouseJoystickBoard/*.cpp then silently do not get compiled, and the build
; succeeds while testing old code. symlink:// links instead of copying.
lib_deps_local =
    symlink://src/MouseJoystickBoard

; The TMC5130A/TMC5160A driver library, pinned to a tag so a build is
; reproducible. Stage 3 uses it for the ramp generator, the encoder scaler and
; the reference-switch homing; stages 1 and 2 do not use it at all, and stage 2
; deliberately proves the SPI bus with raw datagrams first so that this library
; is never the second unknown in a first-contact test.
;
; Pinned to a tag so a build is reproducible. Stage 3 needs >= 4.1.0 for two
; things 4.0.3 could not express:
;
;   * `DriverParameters::withSenseVoltageMode()` -- the TMC5130A's
;     CHOPCONF.vsense, a factor of 1.8 in coil current on this board's 0.15 ohm
;     shunts, and unreachable through the 4.0.3 API.
;   * `EncoderParameters::withMicrostepsPerPulse(mode, scaled)` -- one signed
;     value for the encoder scaling, so a reversed encoder does not need the
;     16.16 fixed-point split composed by hand.
;
; Swap in `symlink:///home/peter/Repositories/arduino/TMC51X0` to build against
; a local working copy. Do NOT use a bare path -- see the note above about
; PlatformIO copying rather than linking.
lib_deps_external =
    https://github.com/janelia-arduino/TMC51X0.git#4.1.0

[env]
lib_ldf_mode = off
build_flags =
    ${common_env_data.build_flags}
monitor_echo = yes
monitor_eol = LF
monitor_filters =
    send_on_enter
    colorize
monitor_speed = 115200
lib_deps =
    ${common_env_data.lib_deps_builtin}
    ${common_env_data.lib_deps_local}
    ${common_env_data.lib_deps_external}

; -----------------------------------------------------------------------------
; mouse-joystick-pcb
; -----------------------------------------------------------------------------
; A custom RP2040 board, not a Pico: 12 MHz crystal, W25Q128JVPIQ 16 MiB QSPI
; flash, no LED, no SWD header, no RUN connection. `generic` is the right board
; definition because it makes no assumptions this board does not meet -- but see
; the pin-mapping traps documented in src/BoardPins.hpp.
[env:mouse_joystick]
platform = https://github.com/janelia-arduino/platform-raspberrypi.git
board = generic
framework = arduino
board_build.core = earlephilhower
upload_protocol = picotool

; 16 MiB. `generic` already declares this; stating it means a future board
; definition change cannot silently shrink the flash map underneath us. The
; self test probes for address aliasing to confirm the part matches.
board_upload.maximum_size = 16777216
board_build.filesystem_size = 0m

; Universal single-lane 0x03 read. Slower than the Winbond-specific stage 2 but
; it boots regardless of the flash's quad-enable bit, which is what a
; first-article board wants. Switch to env:mouse_joystick_fastflash once stage 1
; passes on real hardware.
board_build.arduino.earlephilhower.boot2_source = boot2_generic_03h_4_padded_checksum.S

; Two of these boards serve one rig, so the USB strings matter for telling them
; apart. The flash unique id printed by the self test is the actual serial.
board_build.arduino.earlephilhower.usb_manufacturer = Orb Weaver
board_build.arduino.earlephilhower.usb_product = mouse-joystick-pcb

; MJ_BOARD_REV 0 is pcb tags v0.1 and v0.2 ONLY -- the boards sent for assembly
; as rev 0. Their RP2040 pad-to-net maps are byte-identical to each other, and
; differ from later revisions only in GP10/GP11/GP13, which they leave unrouted
; and which v0.3 and HEAD route to the angle-output DAC. No connected pin moves,
; so the only firmware-visible difference is which pads count as spare.
;
; DO NOT BUILD THIS ENV FOR A v0.3 BOARD. v0.3 is MJ_BOARD_REV 1; see
; env:mouse_joystick_rev1 below. Building rev 0 against v0.3 makes the
; spare-pad test drive internal pull-ups and pull-downs onto the DAC's SPI bus
; and its chip select.
build_flags =
    ${common_env_data.build_flags}
    -DMOUSE_JOYSTICK_PCB=1
    -DMJ_BOARD_REV=0

; Same board, quad-lane stage 2 matched to the W25Q128JV. Faster XIP; only use
; it after the safe boot2 has proven the flash works.
[env:mouse_joystick_fastflash]
extends = env:mouse_joystick
board_build.arduino.earlephilhower.boot2_source = boot2_w25q128jvxq_4_padded_checksum.S

; MJ_BOARD_REV 1: pcb tag v0.3 and later, including HEAD. GP10/GP11/GP13 carry
; the angle-output DAC and must not be pulled around by the spare-pad test.
;
; THIS IS THE ENV TO BUILD FOR A v0.3 BOARD. The name says "rev1" rather than
; "v0.3", which reads as if no fabricated board matches it. One does. Read off
; the v0.3 kicad_pcb, footprint U501: pad 13 = GP10 = /mcu/DAC_SPI_SCK_,
; pad 14 = GP11 = /mcu/DAC_SPI_COPI_, pad 16 = GP13 = /mcu/~{DAC_CS_}.
; Confirmed on board E4654C159F171E34, stage 1 passed 2026-09-09.
[env:mouse_joystick_rev1]
extends = env:mouse_joystick
build_flags =
    ${common_env_data.build_flags}
    -DMOUSE_JOYSTICK_PCB=1
    -DMJ_BOARD_REV=1

; -----------------------------------------------------------------------------
; Host tests
; -----------------------------------------------------------------------------
; Only the Arduino-free arithmetic in src/Conversions.hpp is testable here.
; Everything else on this board needs the board.
[env:native]
platform = native
test_build_src = no
test_framework = unity
test_filter = native/*
build_flags =
    -Isrc
lib_deps =
    throwtheswitch/Unity@^2.6.1
